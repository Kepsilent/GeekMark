<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- 向上箭头：竖线 -->
  <line x1="12" y1="19" x2="12" y2="5" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 向上箭头：头部 -->
  <polyline points="6,11 12,5 18,11" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 底部横线（表示云端） -->
  <line x1="4" y1="21" x2="20" y2="21" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
</svg>