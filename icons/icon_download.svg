<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- 向下箭头：竖线 -->
  <line x1="12" y1="5" x2="12" y2="19" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 向下箭头：头部 -->
  <polyline points="6,13 12,19 18,13" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 顶部横线（表示云端） -->
  <line x1="4" y1="3" x2="20" y2="3" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
</svg>